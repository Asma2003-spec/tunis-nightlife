services:
  db:
    image: postgis/postgis:16-3.4
    container_name: tunis-nightlife-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tunis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tunis_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-tunis_nightlife}
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tunis} -d ${POSTGRES_DB:-tunis_nightlife}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
